<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cineseriescritics</title>
  <link rel="stylesheet" href="Cineseriescritics.css">
  <link rel="icon" href="Cineseriescritics.ico" type="image/x-icon">
</head>
<body>
  <div id="logo">
      <img src="Cineseriescritics.png" alt="Logotipo Cineseriescritics">
  </div>
  
  <div class="layout-principal">
    <!-- SIDEBAR IZQUIERDO -->
    <aside id="sidebarIzquierda">
      <h3>Filtros</h3>
      <ul>
        <li>Acción</li>
        <li>Drama</li>
        <li>Comedia</li>
      </ul>
    </aside>

    <!-- CONTENIDO CENTRAL (catálogo o detalle) -->
    <main class="contenido-principal">
      <div id="contenedorPeliculas" class="grid-peliculas">
        <!-- Tarjetas de películas -->
      </div>
      
      <div id="detallePelicula" style="display:none;">
        <!-- Detalle de la película -->
      </div>
    </main>

    <!-- SIDEBAR DERECHO -->
    <aside id="sidebarDerecha">
      <h3>Populares</h3>
      <ul>
        <li>película 1</li>
        <li>película 2</li>
      </ul>
    </aside>
  </div>

  <script src="Cineseriescritics.js"></script>
</body>
</html>
